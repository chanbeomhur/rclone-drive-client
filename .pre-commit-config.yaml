minimum_pre_commit_version: '4.7.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/chanbeomhur/research-agent-home
    rev: v1.1.22
    hooks:
      - id: research-rules
